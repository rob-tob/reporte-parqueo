<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Reporte Parqueo en Vivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-2 .form-group {
            margin-bottom: 0;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 25px 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #cfe2ff;
            color: #0c5de4;
            border: 1px solid #b6d4fe;
            display: block;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #1565c0;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(12, 93, 228, 0.3);
            border-radius: 50%;
            border-top-color: #0c5de4;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Reporte Parqueo</h1>
            <p>En Vivo</p>
        </div>

        <div class="info-box">
            ℹ️ Completa los datos de la hora que corresponda. Los campos son requeridos.
        </div>

        <form id="reportForm">
            <div class="form-group">
                <label for="fecha">📅 Fecha del Reporte *</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">🕐 Selecciona Hora *</label>
                <select id="hora" name="hora" required>
                    <option value="">-- Elige una hora --</option>
                    <option value="12:00am">12:00am</option>
                    <option value="04:00am">04:00am</option>
                    <option value="06:00am">06:00am</option>
                    <option value="08:00am">08:00am</option>
                    <option value="10:00am">10:00am</option>
                    <option value="01:00pm">01:00pm</option>
                    <option value="03:00pm">03:00pm</option>
                    <option value="05:00pm">05:00pm</option>
                    <option value="08:00pm">08:00pm</option>
                    <option value="10:00pm">10:00pm</option>
                </select>
            </div>

            <div class="divider"></div>

            <div class="section-title">📍 Entrada</div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="entradaCarros">Carros *</label>
                    <input type="number" id="entradaCarros" name="entradaCarros" min="0" required>
                </div>
                <div class="form-group">
                    <label for="entradaMotos">Motos *</label>
                    <input type="number" id="entradaMotos" name="entradaMotos" min="0" required>
                </div>
            </div>

            <div class="section-title" style="margin-top: 20px;">🚗 Salida</div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="salidaCarros">Carros *</label>
                    <input type="number" id="salidaCarros" name="salidaCarros" min="0" required>
                </div>
                <div class="form-group">
                    <label for="salidaMotos">Motos *</label>
                    <input type="number" id="salidaMotos" name="salidaMotos" min="0" required>
                </div>
            </div>

            <div class="divider"></div>
            <div class="section-title">📊 Ocupación</div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="totalCarros">Total Carros *</label>
                    <input type="number" id="totalCarros" name="totalCarros" min="0" required>
                </div>
                <div class="form-group">
                    <label for="totalMotos">Total Motos *</label>
                    <input type="number" id="totalMotos" name="totalMotos" min="0" required>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-submit">✅ Enviar Reporte</button>
                <button type="reset" id="resetBtn" class="btn btn-reset">↻ Limpiar</button>
            </div>

            <div id="status" class="status"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('reportForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fechaInput = document.getElementById('fecha');
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMErK_ZakrjehkOH1WRNI-wo3iAOWoght6QxuerL-Ss3dVvsksTOwjIGJZp6At_qgS/exec';

        let isSubmitting = false;

        // Establecer fecha de hoy por defecto
        function setTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            fechaInput.value = `${year}-${month}-${day}`;
        }

        // Llamar al cargar la página
        setTodayDate();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (isSubmitting) return;

            if (!form.checkValidity()) {
                showStatus('Por favor completa todos los campos', 'error');
                return;
            }

            isSubmitting = true;
            submitBtn.disabled = true;
            resetBtn.disabled = true;
            showStatus('<span class="spinner"></span>Enviando...', 'loading');

            // Convertir fecha de YYYY-MM-DD a DD/MM/YYYY para mejor legibilidad
            const fechaRaw = document.getElementById('fecha').value;
            const [year, month, day] = fechaRaw.split('-');
            const fechaFormato = `${day}/${month}/${year}`;

            const formData = {
                fecha: fechaFormato,
                timestamp: new Date().toLocaleString('es-GT'),
                hora: document.getElementById('hora').value,
                entradaCarros: parseInt(document.getElementById('entradaCarros').value),
                entradaMotos: parseInt(document.getElementById('entradaMotos').value),
                salidaCarros: parseInt(document.getElementById('salidaCarros').value),
                salidaMotos: parseInt(document.getElementById('salidaMotos').value),
                totalCarros: parseInt(document.getElementById('totalCarros').value),
                totalMotos: parseInt(document.getElementById('totalMotos').value),
            };

            console.log('Datos a enviar:', formData);

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    showStatus('✅ Reporte enviado correctamente', 'success');
                    form.reset();
                    setTodayDate();
                    setTimeout(() => {
                        statusDiv.style.display = 'none';
                    }, 3000);
                } else {
                    showStatus('❌ Error: ' + result.message, 'error');
                }

            } catch (error) {
                showStatus('❌ Error al enviar: ' + error.message, 'error');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                resetBtn.disabled = false;
            }
        });

        function showStatus(message, type) {
            statusDiv.innerHTML = message;
            statusDiv.className = 'status ' + type;
        }
    </script>
</body>
</html>
